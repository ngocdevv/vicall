plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.vicallcallmanager'
version = '0.5.1'

android {
  namespace "expo.modules.vicallcallmanager"

  defaultConfig {
    versionCode 6
    versionName "0.5.1"
  }

  lint {
    abortOnError false
  }
}

dependencies {
  implementation "androidx.core:core-ktx:1.16.0"
  compileOnly "com.cloudflare.realtimekit:webrtc-android:137.7151.10.2"
  compileOnly "host.exp.exponent:expo.modules.notifications:56.0.22"
  compileOnly "com.google.firebase:firebase-messaging:25.0.1"
}
